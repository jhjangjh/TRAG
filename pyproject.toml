[build-system]
requires = ["setuptools==78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "trag"
version = "0.1.0"
description = "Token-level Response-visual Attention Guidance for multimodal LLM distillation."
readme = "README.md"
requires-python = ">=3.10,<3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "torch==2.0.1",
    "torchvision==0.15.2",
    "transformers==4.40.1",
    "tokenizers==0.19.0",
    "numpy==1.26.4",
    "Pillow>=9.4,<12",
    "packaging>=23,<26",
    "huggingface-hub>=0.19.3,<1",
    "safetensors>=0.4,<1",
    "sentencepiece==0.1.99",
    "tiktoken>=0.5,<1",
    "einops==0.6.1",
    "einops-exts==0.0.4",
]

[project.optional-dependencies]
train = [
    "accelerate==0.27.2",
    "deepspeed==0.14.0",
    "peft==0.10.0",
    "tensorboard>=2.13,<3",
    "ninja>=1.11,<2",
]
eval = [
    "pandas>=2,<3",
    "pyarrow>=14,<24",
    "openpyxl>=3.1,<4",
    "requests>=2.31,<3",
    "shortuuid>=1,<2",
    "tqdm>=4.65,<5",
]
quantization = ["bitsandbytes==0.41.0"]
serve = ["gradio==3.35.2", "requests>=2.31,<3"]
wandb = ["wandb>=0.15,<1"]
dev = ["pytest>=8,<9"]

[project.urls]
"Homepage" = "https://github.com/jhjangjh/TRAG"
"Paper" = "https://arxiv.org/abs/2607.02593"
"Bug Tracker" = "https://github.com/jhjangjh/TRAG/issues"

[tool.setuptools.packages.find]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*"]
